        const nodes = new vis.DataSet(rawNodes);
        const edges = new vis.DataSet(rawEdges);
        const container = document.getElementById("red");
        const groupColors = {"memoria_episodico": {"color": "#74c0fc", "highlight": "#a5d8ff"}, "memoria_semantico": {"color": "#ffd166", "highlight": "#ffe29a"}, "tipo_evento": {"color": "#ff7b72", "highlight": "#ffa198"}, "accion": {"color": "#80ed99", "highlight": "#b7f7c6"}, "objeto": {"color": "#c77dff", "highlight": "#ddb0ff"}, "origen": {"color": "#48cae4", "highlight": "#90e0ef"}};

        function getColorForGroup(group) {
            if (groupColors[group]) return groupColors[group];
            const hue = (group.length * 53) % 360;
            return {
                color: `hsl(${hue}, 70%, 62%)`,
                highlight: `hsl(${hue}, 78%, 75%)`
            };
        }

        const allGroups = [...new Set(rawNodes.map((node) => node.group))];
        const groups = {};
        allGroups.forEach((group) => {
            const tone = getColorForGroup(group);
            groups[group] = {
                color: {
                    background: tone.color,
                    border: tone.highlight,
                    highlight: {
                        background: tone.highlight,
                        border: tone.highlight
                    },
                    hover: {
                        background: tone.highlight,
                        border: tone.highlight
                    }
                }
            };
        });

        const options = {
            nodes: {
                shape: "dot",
                scaling: {
                    min: 10,
                    max: 36,
                    label: { enabled: true, min: 11, max: 24 }
                },
                borderWidth: 1.5,
                borderWidthSelected: 3,
                shadow: {
                    enabled: true,
                    color: "rgba(0,0,0,0.35)",
                    size: 10
                },
                font: {
                    color: "#edf6ff",
                    size: 14,
                    face: "Segoe UI"
                }
            },
            edges: {
                selectionWidth: 2,
                hoverWidth: 1.2,
                smooth: {
                    enabled: true,
                    type: "dynamic"
                },
                font: {
                    color: "#dceeff",
                    size: 10,
                    align: "middle",
                    background: "rgba(7,16,28,0.8)",
                    strokeWidth: 0
                }
            },
            groups,
            layout: {
                improvedLayout: true
            },
            physics: {
                solver: "forceAtlas2Based",
                forceAtlas2Based: {
                    gravitationalConstant: -42,
                    springLength: 145,
                    springConstant: 0.07,
                    damping: 0.45,
                    avoidOverlap: 0.55
                },
                stabilization: {
                    iterations: 180,
                    fit: true
                }
            },
            interaction: {
                hover: true,
                tooltipDelay: 120,
                navigationButtons: true,
                keyboard: true,
                multiselect: true
            }
        };

        const network = new vis.Network(container, { nodes, edges }, options);

        const legendDiv = document.getElementById("leyenda");
        legendDiv.innerHTML = allGroups.map((group) => {
            const tone = getColorForGroup(group);
            return `
                <div class="legend-item">
                    <span class="legend-swatch" style="background:${tone.color};"></span>
                    <span>${group}</span>
                </div>
            `;
        }).join("");

        network.once("stabilizationIterationsDone", () => {
            network.setOptions({ physics: false });
        });
